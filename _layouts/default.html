<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {%- if page.seo_title -%}
    <title>{{ page.seo_title }}</title>
    {% seo title=false %}
    {%- else -%}
    {% seo %}
    {%- endif -%}
  </head>
  <body class="layout-{{ page.layout | default: 'default' }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
    <div class="modal" id="video-modal" role="dialog" aria-modal="true" aria-label="Video player" aria-hidden="true">
      <div class="modal-overlay" data-modal-close></div>
      <div class="modal-content">
        <button type="button" class="modal-close" data-modal-close aria-label="Close video">×</button>
        <div class="modal-frame">
          <iframe data-video-player src="" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
      </div>
    </div>
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/modal.js' | relative_url }}" defer></script>
  </body>
</html>
