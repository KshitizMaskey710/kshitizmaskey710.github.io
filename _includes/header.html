<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}"><img class="logo" src="{{ '/assets/images/logo.png' | relative_url }}" alt="Kshitiz Maskey logo"></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="nav" aria-label="Primary navigation">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.nav == item.label %} class="active" aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
      </nav>
    </div>
  </div>
</header>
