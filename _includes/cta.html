<section class="section no-border">
  <div class="container">
    <div class="footer-cta">
      {% if include.label %}<p class="label">{{ include.label }}</p>{% endif %}
      {% if include.title %}<h2>{{ include.title }}</h2>{% endif %}
      {% if include.lead %}<p class="lead">{{ include.lead }}</p>{% endif %}
      {% if include.buttons %}<div class="btn-row">{% for button in include.buttons %}<a class="btn{% if button.primary %} primary{% endif %}" href="{{ button.url | relative_url }}"{% if button.external %} target="_blank" rel="noreferrer"{% endif %}>{{ button.label }}</a>{% endfor %}</div>{% endif %}
    </div>
  </div>
</section>
